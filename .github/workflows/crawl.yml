# Weekly crawl (scripts/site-check/crawl.cjs): every button and link on the main pages and a sample of each kind of
# page, in Chrome and Safari's engine. Mondays, and on demand. A failed run emails the repository owner.
name: Weekly crawl
on:
  schedule:
    - cron: '23 14 * * 1'   # Mondays, 8:23 AM Central
  workflow_dispatch:
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/real-estate-website-build-9itecr   # the live site's branch (scheduled runs start from main)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and the ${{ matrix.browser }} browser
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm install --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Crawl (${{ matrix.browser }})
        env:
          BROWSER: ${{ matrix.browser }}
          NODE_PATH: /tmp/pw/node_modules
        run: node scripts/site-check/crawl.cjs
