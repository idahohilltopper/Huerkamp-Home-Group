# Netlify builds the site from this repo. Every push to a branch or pull request
# gets its own preview address; the main branch becomes the live site.
[build]
  # New YouTube videos are picked up on every build (the hourly listing rebuilds, 8 AM-10 PM), so they appear within
  # about an hour; if YouTube can't be reached, the build goes on with the videos it has.
  command = "(timeout 60 python3 scripts/update-youtube.py || echo 'YouTube update skipped') && npm run build"
  publish = "dist"
  # Skip the build (saves Netlify usage) when a push changes only notes: docs/ and CLAUDE.md. Exit 0 = skip. The
  # scheduled listing rebuilds (build hooks) and "Trigger deploy" in Netlify always build; so does anything else.
  ignore = "[ -z \"$INCOMING_HOOK_TITLE\" ] && [ -n \"$CACHED_COMMIT_REF\" ] && [ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)docs' ':(exclude)CLAUDE.md'"

[build.environment]
  NODE_VERSION = "22"

# The MapTiler key is NOT stored here. Add it in Netlify:
# Site configuration > Environment variables > PUBLIC_MAPTILER_KEY

# The home search (/api/search) answers from the listing index each build writes (src/lib/search-index.mjs).
[functions.search]
  included_files = [".cache/search-index.json"]

# Saved searches (/api/alerts/*) turn a city or neighborhood into its outline for Repliers.
[functions.old-property]
  included_files = [".cache/search-index.json"]

[functions.alerts]
  included_files = ["src/data/geo/communities.geojson", "src/data/geo/neighborhoods.geojson", ".cache/search-index.json"]

# Keeps .cache-keep/ between builds (the lake sales snapshot, src/lib/lake-sales.mjs, is downloaded about once a week).
[[plugins]]
  package = "netlify-plugin-cache"
  [plugins.inputs]
    paths = [".cache-keep"]
